x-base-provider:
  &base-provider {
    type: http,
    interval: 86400,
    proxy: DIRECT,
    health-check:
      {
        enable: true,
        url: "https://www.gstatic.com/generate_204",
        interval: 300,
      },
    filter: "^(?!.*(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))",
  }

x-url-test:
  &url-test {
    type: url-test,
    url: "https://www.gstatic.com/generate_204",
    interval: 300,
    empty-fallback: REJECT,
    include-all: true,
    hidden: true,
    tolerance: 50,
  }
x-load-balance:
  &load-balance {
    type: load-balance,
    url: "https://www.gstatic.com/generate_204",
    interval: 300,
    empty-fallback: REJECT,
    include-all: true,
    hidden: true,
    strategy: consistent-hashing,
  }
x-fallback:
  &fallback {
    type: fallback,
    url: "https://www.gstatic.com/generate_204",
    interval: 300,
    empty-fallback: REJECT,
  }

x-filter-hk: &filter-hk "(?i)香港|港|(?:^|[^a-z])(hk|hkg|hongkong|hong kong)(?:[^a-z]|$)|🇭🇰"
x-filter-tw: &filter-tw "(?i)台湾|台北|台|(?:^|[^a-z])(tw|twn|taiwan|taipei)(?:[^a-z]|$)|🇹🇼|🇼🇸"
x-filter-jp: &filter-jp "(?i)日本|东京|大阪|(?:^|[^a-z])(jp|jpn|japan|tokyo|osaka)(?:[^a-z]|$)|🇯🇵"
x-filter-sg: &filter-sg "(?i)新加坡|狮城|坡|(?:^|[^a-z])(sg|sgp|singapore)(?:[^a-z]|$)|🇸🇬"
x-filter-kr: &filter-kr "(?i)韩国|韩|首尔|(?:^|[^a-z])(kr|kor|korea|seoul)(?:[^a-z]|$)|🇰🇷"
x-filter-us: &filter-us "(?i)美国|美|洛杉矶|硅谷|圣何塞|(?:^|[^a-z])(us|usa|america|united states|los angeles|san jose)(?:[^a-z]|$)|🇺🇸"
x-filter-cn: &filter-cn "(?i)广州|广东|深圳|中国|(?:^|[^a-z])(cn|china)(?:[^a-z]|$)|🇨🇳"
x-filter-zj: &filter-zj "(?i)^ZJ-"

x-oversea:
  &oversea [
    香港策略,
    台湾策略,
    日本策略,
    狮城策略,
    韩国策略,
    美国策略,
    故障转移,
    自建节点,
    全球手动,
  ]
x-direct:
  &direct [
    中国策略,
    香港策略,
    台湾策略,
    日本策略,
    狮城策略,
    韩国策略,
    美国策略,
    故障转移,
    自建节点,
    全球手动,
  ]
x-us-first:
  &us-first [
    自建节点,
    香港策略,
    台湾策略,
    日本策略,
    狮城策略,
    韩国策略,
    美国策略,
    故障转移,
    全球手动,
  ]


x-rule-set-domain:
  &rule-set-domain {
    type: http,
    behavior: domain,
    format: mrs,
    interval: 86400,
  }
x-rule-set-ipcidr:
  &rule-set-ipcidr {
    type: http,
    behavior: ipcidr,
    format: mrs,
    interval: 86400,
  }

proxy-providers:
  sub1: { <<: *base-provider, url: "" }
  sub2: { <<: *base-provider, url: "" }

proxies: 

# 基础设置
mode: rule
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
ipv6: false
allow-lan: false
unified-delay: true
tcp-concurrent: true
log-level: silent
bind-address: "*"
find-process-mode: strict
keep-alive-interval: 15
keep-alive-idle: 600
skip-auth-prefixes: [127.0.0.1/8, "::1/128"]
experimental: { quic-go-disable-gso: true }

# 控制面板
#external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
#external-ui-name: zashboard
#external-ui: ui
#external-controller: 127.0.0.1:9090
#secret: rkorona
#profile: { store-selected: true, store-fake-ip: true }

# 流量嗅探
sniffer:
  enable: true
  sniff:
    HTTP: { ports: [80, 8080-8880], override-destination: true }
    TLS: { ports: [443, 8443] }
    QUIC: { ports: [443, 8443] }
  skip-domain: ["Mijia Cloud", "+.push.apple.com"]

# TUN模式
tun:
  enable: false
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS设置
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver: [119.29.29.29, 180.184.1.1, 223.5.5.5]
  nameserver: [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
  fake-ip-filter:
    [+.miwifi.com, +.docker.io, +.market.xiaomi.com, +.push.apple.com]

# 代理策略组
proxy-groups:
  # 路由策略
  - {
      name: 国外流量,
      type: select,
      proxies: *oversea,
      icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Global.png,
    }
  - {
      name: 谷歌服务,
      type: select,
      proxies: *us-first,
      icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Google_Search.png,
    }
  - {
      name: 人工智能,
      type: select,
      proxies: *us-first,
      icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/AI.png,
    }
  - {
      name: 国内流量,
      type: select,
      proxies: *direct,
      icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/China.png,
    }
  - {
      name: 广告拦截,
      type: select,
      proxies: [REJECT-DROP, REJECT, DIRECT],
      icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Reject.png,
    }

  # 自动选择
  - {
      name: 故障转移,
      <<: *fallback,
      proxies:
        [美国策略, 日本策略, 狮城策略, 韩国策略, 香港策略, 台湾策略, 自建节点],
      icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/ULB.png,
    }

  # 手动选择
  - {
      name: 全球手动,
      type: select,
      include-all: true,
      icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Clubhouse.png,
    }

  - {
      name: 自建节点,
      type: select,
      include-all: true,
      filter: *filter-zj,
      icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Round_Robin.png,
    }

  # 策略组区域
  - {
      name: 香港策略,
      type: select,
      include-all: true,
      filter: *filter-hk,
      proxies: [香港自动],
      icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Hong_Kong.png,
    }
  - {
      name: 台湾策略,
      type: select,
      include-all: true,
      filter: *filter-tw,
      proxies: [台湾自动],
      icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Taiwan.png,
    }
  - {
      name: 日本策略,
      type: select,
      include-all: true,
      filter: *filter-jp,
      proxies: [日本自动],
      icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Japan.png,
    }
  - {
      name: 狮城策略,
      type: select,
      include-all: true,
      filter: *filter-sg,
      proxies: [狮城自动],
      icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Singapore.png,
    }
  - {
      name: 韩国策略,
      type: select,
      include-all: true,
      filter: *filter-kr,
      proxies: [韩国自动],
      icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Korea.png,
    }
  - {
      name: 美国策略,
      type: select,
      include-all: true,
      filter: *filter-us,
      proxies: [美国自动],
      icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/United_States.png,
    }
  - {
      name: 中国策略,
      type: select,
      include-all: true,
      filter: *filter-cn,
      proxies: [中国自动, DIRECT],
      icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/China.png,
    }

  # 自动测速
  - {
      name: 香港自动,
      <<: *url-test,
      filter: *filter-hk,
      icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Auto.png,
    }
  - {
      name: 台湾自动,
      <<: *url-test,
      filter: *filter-tw,
      icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Auto.png,
    }
  - {
      name: 日本自动,
      <<: *url-test,
      filter: *filter-jp,
      icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Auto.png,
    }
  - {
      name: 狮城自动,
      <<: *url-test,
      filter: *filter-sg,
      icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Auto.png,
    }
  - {
      name: 韩国自动,
      <<: *url-test,
      filter: *filter-kr,
      icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Auto.png,
    }
  - {
      name: 美国自动,
      <<: *url-test,
      filter: *filter-us,
      icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Auto.png,
    }
  - {
      name: 中国自动,
      <<: *url-test,
      filter: *filter-cn,
      icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Auto.png,
    }


    
# 规则路由
rules:
  # 广告拦截
  - RULE-SET,Tracking,广告拦截
  - RULE-SET,Advertising,广告拦截
  - AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((GEOIP,CN,no-resolve)))),广告拦截

  # 本地/私有
  - RULE-SET,Private,DIRECT
  - RULE-SET,PrivateIP,DIRECT,no-resolve

  
  # 人工智能
  - RULE-SET,AI,人工智能
  - RULE-SET,AIIP,人工智能,no-resolve
  
  # 谷歌服务
  - RULE-SET,Google,谷歌服务
  - RULE-SET,GoogleIP,谷歌服务,no-resolve

  # 国外流量
  - RULE-SET,Proxy,国外流量
  - RULE-SET,ProxyIP,国外流量,no-resolve

  # 国内流量
  - RULE-SET,China,国内流量
  - RULE-SET,ChinaIP,国内流量,no-resolve

  # 兜底规则
  - MATCH,国外流量

# 规则集提供者
rule-providers:
  Tracking:
    {
      <<: *rule-set-domain,
      url: https://github.com/666OS/rules/raw/release/mihomo/domain/Tracking.mrs,
    }
  Advertising:
